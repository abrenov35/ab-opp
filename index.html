<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>AB Renov · Capture</title></head>
<body><div id="boot" style="font-family:Arial,Helvetica,sans-serif;padding:30px;text-align:center;color:#172554">Chargement AB OPPORTUNITÉS…</div>
<script>
(async()=>{try{
  const base='https://raw.githubusercontent.com/abrenov35/ab-opp/6697631626b47d4bcaecb74ec3247ace39f4e9e2/index.html';
  let src=await(await fetch(base,{cache:'no-store'})).text();
  src=src.replace("'<span class=\"app-version\">v4</span>','<span class=\"app-version\">v18</span>'","'<span class=\"app-version\">v4</span>','<span class=\"app-version\">v19</span>'");
  const marker='document.open();document.write(html);document.close();';
  const extra=`html=html.replace('<label>Nom *<input id="quickNom"','<label class="wide">Nom *<input id="quickNom"');\nhtml=html.replace(/<div class="field-group full">(?=<label class="field-label">Téléphone(?: |<))/g,'<div class="field-group">');\nhtml=html.replace(/<div class="field-group full">(?=<label class="field-label">Email(?: |<))/g,'<div class="field-group">');\n`;
  if(!src.includes(marker))throw new Error('Point insertion alignement introuvable');
  src=src.replace(marker,extra+marker);
  document.open();document.write(src);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
