<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AB Renov · Capture</title>
</head>
<body>
<div id="boot" style="font-family:Arial,Helvetica,sans-serif;padding:30px;text-align:center;color:#172554">Chargement AB OPPORTUNITÉS…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/abrenov35/ab-opp/c6c19233c82dd0f32ad92a5fbccc3428fd20833d/index.html';
    let html=await (await fetch(base,{cache:'no-store'})).text();
    html=html.replace('<span class="app-version">v4</span>','<span class="app-version">v9</span>');
    html=html.replace(`    <div class="step-label">\n      <span class="step-num">01</span>\n      <span>Capturez l'information</span>\n    </div>\n\n`, '');
    html=html.replace(/\s*<div class="pj-zone"[\s\S]*?<\/div>\s*(?=<button[^>]*id="analyzeBtn")/, '\n');

    // Formulaire direct des informations indispensables sur l'écran de saisie.
    const requiredForm=`<div class="required-entry-card">
      <div class="required-entry-title">Informations obligatoires</div>
      <div class="required-entry-grid">
        <label>Nom *<input id="quickNom" type="text" placeholder="Nom du client"></label>
        <label>Téléphone *<input id="quickTel" type="tel" placeholder="06 00 00 00 00"></label>
        <label class="wide">Email *<input id="quickEmail" type="email" placeholder="client@email.fr"></label>
        <label class="wide">Adresse *<input id="quickAdresse" type="text" placeholder="N° et rue"></label>
        <label>Code postal *<input id="quickCp" type="text" inputmode="numeric" placeholder="35000"></label>
        <label>Ville *<input id="quickVille" type="text" placeholder="Ville"></label>
        <label class="wide">Projet *<textarea id="quickProjet" rows="2" placeholder="Décrivez brièvement le projet"></textarea></label>
      </div>
    </div>`;
    html=html.replace('<section class="step" id="stepCapture">','<section class="step" id="stepCapture">'+requiredForm);

    html=html.replace('</head>', `<style>
      .input-modes{justify-content:center!important;margin-left:auto!important;margin-right:auto!important;max-width:430px!important;gap:10px!important;}
      .header-actions,.toolbar-actions,.top-actions,.nav-actions{justify-content:center!important;margin-left:auto!important;margin-right:auto!important;}
      .main{max-width:720px!important;padding:20px 18px 56px!important;}.pj-zone{display:none!important;}
      .required-entry-card{background:#fff;border:1px solid rgba(22,45,73,.13);border-radius:14px;padding:16px;margin:0 0 16px;box-shadow:0 4px 18px rgba(22,45,73,.07);}
      .required-entry-title{font-size:15px;font-weight:700;color:#162D49;margin-bottom:12px;}
      .required-entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
      .required-entry-grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#46566a;text-transform:uppercase;letter-spacing:.03em;}
      .required-entry-grid label.wide{grid-column:1/-1;}
      .required-entry-grid input,.required-entry-grid textarea{width:100%;min-height:42px;border:1px solid #d9e0e8;border-radius:8px;background:#f8fafc;padding:9px 11px;font:14px Arial,sans-serif;color:#162D49;outline:none;text-transform:none;letter-spacing:normal;}
      .required-entry-grid textarea{resize:vertical;min-height:62px;}
      .required-entry-grid input:focus,.required-entry-grid textarea:focus{background:#fff;border-color:#24428f;box-shadow:0 0 0 3px rgba(36,66,143,.10);}
      .required-entry-grid .missing{border-color:#c0392b!important;background:#fff8f7!important;}
      .result-card{border:1px solid rgba(22,45,73,.12)!important;border-radius:16px!important;box-shadow:0 8px 28px rgba(22,45,73,.10)!important;background:#fff!important;}.result-section{padding:18px 20px!important;}.result-section-title{font-size:13px!important;color:#162D49!important;letter-spacing:.08em!important;margin-bottom:14px!important;}.fields-grid{grid-template-columns:1fr 1fr!important;gap:12px!important;}.field-group.full{grid-column:1/-1!important;}.field-label{font-size:11px!important;color:#46566a!important;letter-spacing:.04em!important;}.field-label .req{color:#c0392b;font-weight:700;margin-left:3px;}.field-input{min-height:44px!important;padding:10px 12px!important;border-radius:9px!important;background:#f8fafc!important;border:1px solid #d9e0e8!important;font-size:15px!important;}.field-input:focus{background:#fff!important;border-color:#24428f!important;box-shadow:0 0 0 3px rgba(36,66,143,.10)!important;}.field-input.required-missing{border-color:#c0392b!important;background:#fff8f7!important;}.result-actions{justify-content:center!important;gap:10px!important;margin-top:18px!important;}.send-btn{max-width:360px!important;flex:1 1 280px!important;}
      @media(max-width:600px){.main{padding:12px 10px 42px!important;}.required-entry-card{padding:12px;}.required-entry-grid{grid-template-columns:1fr 1fr;gap:9px;}.required-entry-grid .wide{grid-column:1/-1!important;}.result-section{padding:15px 14px!important;}.fields-grid{grid-template-columns:1fr!important;gap:10px!important;}.field-group,.field-group.full{grid-column:1/-1!important;}}
    </style></head>`);

    // Injecte les données saisies directement dans les champs analysés avant l'analyse IA.
    html=html.replace('el.analyzeBtn.addEventListener(\'click\',analyze);',`el.analyzeBtn.addEventListener('click',()=>{
      const q={nom:document.getElementById('quickNom'),tel:document.getElementById('quickTel'),email:document.getElementById('quickEmail'),adresse:document.getElementById('quickAdresse'),cp:document.getElementById('quickCp'),ville:document.getElementById('quickVille'),projet:document.getElementById('quickProjet')};
      Object.values(q).forEach(x=>x.classList.remove('missing'));
      const missing=Object.values(q).filter(x=>!x.value.trim());
      if(missing.length){missing.forEach(x=>x.classList.add('missing'));missing[0].focus();showToast('⚠️ Complétez les informations obligatoires','error',4000);return;}
      if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(q.email.value.trim())){q.email.classList.add('missing');q.email.focus();showToast('⚠️ Adresse email invalide','error',4000);return;}
      el.rNom.value=q.nom.value.trim();el.rTel.value=q.tel.value.trim();el.rEmail.value=q.email.value.trim();el.rAdresse.value=q.adresse.value.trim();el.rCp.value=q.cp.value.trim();el.rVille.value=q.ville.value.trim();el.rProjet.value=q.projet.value.trim();
      analyze();
    });`);

    // Réinjecte après analyse pour garantir que l'IA n'écrase pas les données obligatoires saisies.
    html=html.replace('function populate(d){',`function populate(d){
  const qn=document.getElementById('quickNom'),qt=document.getElementById('quickTel'),qe=document.getElementById('quickEmail'),qa=document.getElementById('quickAdresse'),qc=document.getElementById('quickCp'),qv=document.getElementById('quickVille'),qp=document.getElementById('quickProjet');
  if(qn&&qn.value.trim())d.nom=qn.value.trim();if(qt&&qt.value.trim())d.telephone=qt.value.trim();if(qe&&qe.value.trim())d.email=qe.value.trim();if(qa&&qa.value.trim())d.adresse=qa.value.trim();if(qc&&qc.value.trim())d.code_postal=qc.value.trim();if(qv&&qv.value.trim())d.ville=qv.value.trim();if(qp&&qp.value.trim())d.type_projet=qp.value.trim();`);

    html=html.replace('<label class="field-label">Nom</label><input type="text" id="rNom" class="field-input" placeholder="—"/>','<label class="field-label">Nom <span class="req">*</span></label><input type="text" id="rNom" class="field-input" placeholder="Nom du client" required/>');
    html=html.replace('<label class="field-label">Téléphone</label><input type="tel" id="rTel" class="field-input" placeholder="—"/>','<label class="field-label">Téléphone <span class="req">*</span></label><input type="tel" id="rTel" class="field-input" placeholder="06 00 00 00 00" required/>');
    html=html.replace('<label class="field-label">Email</label><input type="email" id="rEmail" class="field-input" placeholder="—"/>','<label class="field-label">Email <span class="req">*</span></label><input type="email" id="rEmail" class="field-input" placeholder="client@email.fr" required/>');
    html=html.replace('<label class="field-label">Adresse</label><input type="text" id="rAdresse" class="field-input" placeholder="—"/>','<label class="field-label">Adresse <span class="req">*</span></label><input type="text" id="rAdresse" class="field-input" placeholder="N° et rue" required/>');
    html=html.replace('<label class="field-label">Ville</label><input type="text" id="rVille" class="field-input" placeholder="—"/>','<label class="field-label">Ville <span class="req">*</span></label><input type="text" id="rVille" class="field-input" placeholder="Ville" required/>');
    html=html.replace('<label class="field-label">Code postal</label><input type="text" id="rCp" class="field-input" placeholder="—"/>','<label class="field-label">Code postal <span class="req">*</span></label><input type="text" id="rCp" class="field-input" placeholder="35000" required/>');
    html=html.replace('<label class="field-label">Type de projet</label><input type="text" id="rProjet" class="field-input" placeholder="—"/>','<label class="field-label">Projet <span class="req">*</span></label><input type="text" id="rProjet" class="field-input" placeholder="Projet" required/>');

    html=html.replace('async function send(){\n  const d=collectResult();',`async function send(){
  const d=collectResult();
  const requiredFields=[{el:el.rNom,value:d.nom,label:'Nom'},{el:el.rTel,value:d.telephone,label:'Téléphone'},{el:el.rEmail,value:d.email,label:'Email'},{el:el.rAdresse,value:d.adresse,label:'Adresse'},{el:el.rVille,value:d.ville,label:'Ville'},{el:el.rCp,value:d.cp,label:'Code postal'},{el:el.rProjet,value:d.projet,label:'Projet'}];
  requiredFields.forEach(f=>f.el.classList.remove('required-missing'));const missing=requiredFields.filter(f=>!f.value);if(missing.length){missing.forEach(f=>f.el.classList.add('required-missing'));missing[0].el.focus();showToast('⚠️ À compléter : '+missing.map(f=>f.label).join(', '),'error',5000);return;}`);

    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message;}
})();
</script>
</body>
</html>
