<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>AB Renov · Capture</title></head>
<body><div id="boot" style="font-family:Arial,Helvetica,sans-serif;padding:30px;text-align:center;color:#172554">Chargement AB OPPORTUNITÉS…</div>
<script>
(async()=>{try{
const base='https://raw.githubusercontent.com/abrenov35/ab-opp/c6c19233c82dd0f32ad92a5fbccc3428fd20833d/index.html';let html=await(await fetch(base,{cache:'no-store'})).text();
html=html.replace('<span class="app-version">v4</span>','<span class="app-version">v17</span>');
html=html.replace('<span class="logo-sub">Capture</span>','<span class="logo-sub">Informations obligatoires</span>');
html=html.replace(`    <div class="step-label">\n      <span class="step-num">01</span>\n      <span>Capturez l'information</span>\n    </div>\n\n`,'');
html=html.replace(/\s*<div class="pj-zone"[\s\S]*?<\/div>\s*(?=<button[^>]*id="analyzeBtn")/,'\n');
const form=`<div class="required-entry-card"><div class="required-entry-grid"><label>Nom *<input id="quickNom" type="text" placeholder="Nom du client"></label><label>Téléphone *<input id="quickTel" type="tel" placeholder="06 00 00 00 00"></label><label class="wide">Email *<input id="quickEmail" type="email" placeholder="client@email.fr"></label><label class="wide">Adresse *<input id="quickAdresse" type="text" placeholder="N° et rue"></label><label>Code postal *<input id="quickCp" type="text" inputmode="numeric" placeholder="35000"></label><label>Ville *<input id="quickVille" type="text" placeholder="Ville"></label><label class="wide">Projet *<textarea id="quickProjet" rows="2" placeholder="Décrivez brièvement le projet"></textarea></label></div></div>`;
html=html.replace('<section class="step" id="stepCapture">','<section class="step" id="stepCapture">'+form);
html=html.replace('</head>',`<style>
.input-modes,.capture-zone,.pj-zone{display:none!important}.main{max-width:720px!important;padding:20px 18px 56px!important}.logo-sub{display:inline-block!important;color:rgba(255,255,255,.9)!important;font-size:11px!important;font-weight:700!important;letter-spacing:0!important;text-transform:none!important}.required-entry-card{background:#fff;border:1px solid rgba(22,45,73,.13);border-radius:14px;padding:16px;margin:0 0 10px;box-shadow:0 4px 18px rgba(22,45,73,.07)}.required-entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.required-entry-grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#46566a;text-transform:uppercase}.required-entry-grid label.wide{grid-column:1/-1}.required-entry-grid input,.required-entry-grid textarea{width:100%;min-height:42px;border:1px solid #d9e0e8;border-radius:8px;background:#f8fafc;padding:9px 11px;font:14px Arial,sans-serif;color:#162D49;outline:none;text-transform:none}.required-entry-grid textarea{resize:vertical;min-height:62px}.required-entry-grid input:focus,.required-entry-grid textarea:focus{background:#fff;border-color:#24428f;box-shadow:0 0 0 3px rgba(36,66,143,.10)}.required-entry-grid .missing{border-color:#c0392b!important;background:#fff8f7!important}.analyze-btn{margin-top:8px!important}.result-actions{justify-content:center!important}.field-label .req{color:#c0392b;font-weight:700}@media(max-width:600px){.main{padding:12px 10px 42px!important}.required-entry-card{padding:12px}.required-entry-grid{grid-template-columns:1fr 1fr;gap:9px}.required-entry-grid .wide{grid-column:1/-1!important}.logo-sub{font-size:10px!important}}
</style></head>`);
html=html.replace(`function hasInput(){ return !!(el.textInput.value.trim()||el.voiceTranscript.value.trim()||S.imgB64) }`,`function quickFieldsText(){const g=id=>(document.getElementById(id)?.value||'').trim();return ['Nom : '+g('quickNom'),'Téléphone : '+g('quickTel'),'Email : '+g('quickEmail'),'Adresse : '+g('quickAdresse'),'Code postal : '+g('quickCp'),'Ville : '+g('quickVille'),'Projet : '+g('quickProjet')].join('\\n')}\nfunction hasInput(){return !!quickFieldsText().replace(/[^:]+:\\s*/g,'').trim()}`);
html=html.replace(`function collectInput(){\n  const parts=[];`,`function collectInput(){\n  const parts=[quickFieldsText()];`);
html=html.replace("el.analyzeBtn.addEventListener('click',analyze);",`el.analyzeBtn.addEventListener('click',()=>{const ids=['quickNom','quickTel','quickEmail','quickAdresse','quickCp','quickVille','quickProjet'];const a=ids.map(id=>document.getElementById(id));a.forEach(x=>x.classList.remove('missing'));const m=a.filter(x=>!x.value.trim());if(m.length){m.forEach(x=>x.classList.add('missing'));m[0].focus();showToast('⚠️ Complétez les informations obligatoires','error',4000);return}const e=document.getElementById('quickEmail');if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(e.value.trim())){e.classList.add('missing');e.focus();showToast('⚠️ Adresse email invalide','error',4000);return}analyze()});`);
html=html.replace('function populate(d){',`function populate(d){const g=id=>(document.getElementById(id)?.value||'').trim();if(g('quickNom'))d.nom=g('quickNom');if(g('quickTel'))d.telephone=g('quickTel');if(g('quickEmail'))d.email=g('quickEmail');if(g('quickAdresse'))d.adresse=g('quickAdresse');if(g('quickCp'))d.code_postal=g('quickCp');if(g('quickVille'))d.ville=g('quickVille');if(g('quickProjet'))d.type_projet=g('quickProjet');`);
html=html.replace('<label class="field-label">Nom</label>','<label class="field-label">Nom <span class="req">*</span></label>').replace('<label class="field-label">Téléphone</label>','<label class="field-label">Téléphone <span class="req">*</span></label>').replace('<label class="field-label">Email</label>','<label class="field-label">Email <span class="req">*</span></label>').replace('<label class="field-label">Adresse</label>','<label class="field-label">Adresse <span class="req">*</span></label>').replace('<label class="field-label">Ville</label>','<label class="field-label">Ville <span class="req">*</span></label>').replace('<label class="field-label">Code postal</label>','<label class="field-label">Code postal <span class="req">*</span></label>').replace('<label class="field-label">Type de projet</label>','<label class="field-label">Projet <span class="req">*</span></label>');
html=html.replace(/async function showSuccess\(d\)\{[\s\S]*?\n\}\n\n\/\* ── MODAL EMAIL ── \*\//,`async function showSuccess(d){
  const name=[d.prenom,d.nom].filter(Boolean).join(' ')||'—';
  el.successMeta.innerHTML=[
    \`<strong>\${name}</strong>\`,
    d.telephone?\`📞 \${d.telephone}\`:'',
    d.email?\`✉️ \${d.email}\`:'',
    d.ville?\`📍 \${d.ville}\`:'',
    d.projet?\`🔧 \${d.projet}\`:'',
  ].filter(Boolean).join('<br>');
  showStep('success');
  showToast('✅ Opportunité envoyée — création Dropbox traitée par AB-OPP','success',5000);
}

/* ── MODAL EMAIL ── */`);
// V17 : l'interface simplifiée n'utilise plus Texte/Photo/Fichier/PJ. On neutralise uniquement
// leurs écouteurs historiques pour éviter les addEventListener sur des éléments absents.
html=html.replace("  el.pickFileBtn.addEventListener('click',()=>el.fileInput.click());","  if(el.pickFileBtn&&el.fileInput)el.pickFileBtn.addEventListener('click',()=>el.fileInput.click());");
html=html.replace("  el.fileInput.addEventListener('change',e=>handleImg(e.target.files[0]));","  if(el.fileInput)el.fileInput.addEventListener('change',e=>handleImg(e.target.files[0]));");
html=html.replace("  document.getElementById('pickGalleryBtn').addEventListener('click',()=>document.getElementById('fileInputGallery').click());","  document.getElementById('pickGalleryBtn')?.addEventListener('click',()=>document.getElementById('fileInputGallery')?.click());");
html=html.replace("  document.getElementById('fileInputGallery').addEventListener('change',e=>handleImg(e.target.files[0]));","  document.getElementById('fileInputGallery')?.addEventListener('change',e=>handleImg(e.target.files[0]));");
html=html.replace("  document.getElementById('pickFichierBtn').addEventListener('click',()=>document.getElementById('fileInputFichier').click());","  document.getElementById('pickFichierBtn')?.addEventListener('click',()=>document.getElementById('fileInputFichier')?.click());");
html=html.replace("  document.getElementById('fileInputFichier').addEventListener('change',e=>handleImg(e.target.files[0]));","  document.getElementById('fileInputFichier')?.addEventListener('change',e=>handleImg(e.target.files[0]));");
html=html.replace("  document.getElementById('removeImgFichier').addEventListener('click',clearImg);","  document.getElementById('removeImgFichier')?.addEventListener('click',clearImg);");
html=html.replace("  el.dropZone.addEventListener('dragover',e=>{e.preventDefault();el.dropZone.classList.add('drag-over')});","  if(el.dropZone)el.dropZone.addEventListener('dragover',e=>{e.preventDefault();el.dropZone.classList.add('drag-over')});");
html=html.replace("  el.dropZone.addEventListener('dragleave',()=>el.dropZone.classList.remove('drag-over'));","  if(el.dropZone)el.dropZone.addEventListener('dragleave',()=>el.dropZone.classList.remove('drag-over'));");
html=html.replace("  el.dropZone.addEventListener('drop',e=>{e.preventDefault();el.dropZone.classList.remove('drag-over');handleImg(e.dataTransfer.files[0])});","  if(el.dropZone)el.dropZone.addEventListener('drop',e=>{e.preventDefault();el.dropZone.classList.remove('drag-over');handleImg(e.dataTransfer.files[0])});");
html=html.replace("  el.removeImg.addEventListener('click',clearImg);","  if(el.removeImg)el.removeImg.addEventListener('click',clearImg);");
html=html.replace("  el.voiceBtn.addEventListener('click',toggleVoice);","  if(el.voiceBtn)el.voiceBtn.addEventListener('click',toggleVoice);");
html=html.replace("  document.getElementById('pjPickBtn').addEventListener('click', ()=>document.getElementById('pjInput').click());","  document.getElementById('pjPickBtn')?.addEventListener('click',()=>document.getElementById('pjInput')?.click());");
html=html.replace("  document.getElementById('pjInput').addEventListener('change', e => handlePJ(e.target.files));","  document.getElementById('pjInput')?.addEventListener('change',e=>handlePJ(e.target.files));");
html=html.replace("  pjDrop.addEventListener('dragover', e=>{e.preventDefault();pjDrop.classList.add('drag-over')});","  if(pjDrop)pjDrop.addEventListener('dragover',e=>{e.preventDefault();pjDrop.classList.add('drag-over')});");
html=html.replace("  pjDrop.addEventListener('dragleave', ()=>pjDrop.classList.remove('drag-over'));","  if(pjDrop)pjDrop.addEventListener('dragleave',()=>pjDrop.classList.remove('drag-over'));");
html=html.replace("  pjDrop.addEventListener('drop', e=>{e.preventDefault();pjDrop.classList.remove('drag-over');handlePJ(e.dataTransfer.files)});","  if(pjDrop)pjDrop.addEventListener('drop',e=>{e.preventDefault();pjDrop.classList.remove('drag-over');handlePJ(e.dataTransfer.files)});");
html=html.replace("  pjDrop.addEventListener('click', e=>{if(e.target.tagName!=='BUTTON')document.getElementById('pjInput').click()});","  if(pjDrop)pjDrop.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')document.getElementById('pjInput')?.click()});");
html=html.replace("el.newBtn.addEventListener('click',reset);",`el.newBtn.addEventListener('click',()=>{S={mode:'text',imgFile:null,imgB64:null,imgMime:'image/jpeg',voiceOn:false,recognition:null,rawText:'',extracted:{},pjFiles:[]};['quickNom','quickTel','quickEmail','quickAdresse','quickCp','quickVille','quickProjet'].forEach(id=>{const x=document.getElementById(id);if(x){x.value='';x.classList.remove('missing')}});if(el.stepSuccess)el.stepSuccess.classList.add('hidden');if(el.stepResult)el.stepResult.classList.add('hidden');if(el.stepCapture)el.stepCapture.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});});`);
document.open();document.write(html);document.close();}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
